registry: 960233595057.dkr.ecr.ap-south-1.amazonaws.com/epharmacy-tf
tag: latest   # default tag, used by any service that has no tag of its own
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 640Mi }
services:
  eureka:               { image: eureka,      tag: "latest", port: 8761, enabled: true,  useConfig: false }
  api-gateway-service:  { image: api-gateway, tag: "latest", port: 8080, enabled: true, useConfig: true }
  user-service:         { image: user,        tag: "latest", port: 8081, enabled: true, useConfig: true, dbUrlKey: DB_URL_USER }
  medicine-service:     { image: medicine,    tag: "latest", port: 8082, enabled: true, useConfig: true, dbUrlKey: DB_URL_MEDICINE }
  cart-service:         { image: cart,        tag: "latest", port: 8083, enabled: true, useConfig: true, dbUrlKey: DB_URL_CART }
  order-service:        { image: order,       tag: "latest", port: 8084, enabled: true, useConfig: true, dbUrlKey: DB_URL_ORDER }
  payment-service:      { image: payment,     tag: "latest", port: 8085, enabled: true, useConfig: true, dbUrlKey: DB_URL_PAYMENT }
